name: Rastreador de fuentes y observatorio

on:
  schedule:
    - cron: "17 11 * * 1"        # lunes 06:17 hora de Colombia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt nbclient ipykernel requests
      - name: Revisar las fuentes oficiales
        run: python rastreador/verificar_fuentes.py
      - name: Regenerar resultados con el notebook
        continue-on-error: true
        run: |
          python -m ipykernel install --user --name python3
          jupyter nbconvert --to notebook --execute cafe_papa_narino.ipynb --output /tmp/ejecucion.ipynb --ExecutePreprocessor.timeout=1800
      - name: Reconstruir el observatorio
        run: python observatorio/construir.py
      - name: Guardar cambios
        run: |
          git config user.name "rastreador-fuentes"
          git config user.email "actions@users.noreply.github.com"
          git add rastreador docs salidas
          git diff --cached --quiet || git commit -m "Rastreador: revisión de fuentes y actualización del observatorio ($(date -u +%Y-%m-%d))"
          git push
